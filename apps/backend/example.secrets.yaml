db:
  user: "postgres"
  password: "postgres"
  host: "db"
  port: 5432
  name: "postgres"
  echo: false
  echo_pool: false
  pool_size: 50
  max_overflow: 10

security:
  cors_allowed_origins:
    - "*"
  cors_allow_credentials: true
  jwt:
    token_secret: "CHANGE_THIS_JWT_SECRET"
    token_expiration_minutes: 60
  cookie:
    key: "access_token"
    path: "/"
    secure: false
    samesite: "lax"
  telegram:
    bot_token: ""
    bot_username: ""
    auth_max_age_seconds: 900
