name: idea-code-release

x-backend-env: &backend-env
  APP_DB__USER: ${APP_DB__USER:-postgres}
  APP_DB__PASSWORD: ${APP_DB__PASSWORD:-postgres}
  APP_DB__HOST: ${APP_DB__HOST:-db}
  APP_DB__PORT: "${APP_DB__PORT:-5432}"
  APP_DB__NAME: ${APP_DB__NAME:-postgres}
  APP_DB__ECHO: "${APP_DB__ECHO:-false}"
  APP_DB__ECHO_POOL: "${APP_DB__ECHO_POOL:-false}"
  APP_DB__POOL_SIZE: "${APP_DB__POOL_SIZE:-20}"
  APP_DB__MAX_OVERFLOW: "${APP_DB__MAX_OVERFLOW:-10}"
  APP_SECURITY__JWT__TOKEN_SECRET: ${APP_SECURITY__JWT__TOKEN_SECRET:-CHANGE_THIS_JWT_SECRET}
  APP_SECURITY__JWT__TOKEN_EXPIRATION_MINUTES: "${APP_SECURITY__JWT__TOKEN_EXPIRATION_MINUTES:-60}"
  APP_SECURITY__CORS_ALLOWED_ORIGINS: '${APP_SECURITY__CORS_ALLOWED_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
  APP_SECURITY__CORS_ALLOW_CREDENTIALS: "${APP_SECURITY__CORS_ALLOW_CREDENTIALS:-true}"
  APP_SECURITY__COOKIE__KEY: ${APP_SECURITY__COOKIE__KEY:-access_token}
  APP_SECURITY__COOKIE__PATH: ${APP_SECURITY__COOKIE__PATH:-/}
  APP_SECURITY__COOKIE__SECURE: "${APP_SECURITY__COOKIE__SECURE:-false}"
  APP_SECURITY__COOKIE__SAMESITE: ${APP_SECURITY__COOKIE__SAMESITE:-lax}
  APP_SECURITY__TELEGRAM__BOT_TOKEN: ${APP_SECURITY__TELEGRAM__BOT_TOKEN:-}
  APP_SECURITY__TELEGRAM__BOT_USERNAME: ${APP_SECURITY__TELEGRAM__BOT_USERNAME:-}
  APP_SECURITY__TELEGRAM__AUTH_MAX_AGE_SECONDS: "${APP_SECURITY__TELEGRAM__AUTH_MAX_AGE_SECONDS:-900}"
  APP_OBJECT_STORAGE__ENDPOINT: ${APP_OBJECT_STORAGE__ENDPOINT:-minio:9000}
  APP_OBJECT_STORAGE__ACCESS_KEY: ${APP_OBJECT_STORAGE__ACCESS_KEY:-minioadmin}
  APP_OBJECT_STORAGE__SECRET_KEY: ${APP_OBJECT_STORAGE__SECRET_KEY:-minioadmin}
  APP_OBJECT_STORAGE__SECURE: "${APP_OBJECT_STORAGE__SECURE:-false}"
  APP_OBJECT_STORAGE__BUCKET: ${APP_OBJECT_STORAGE__BUCKET:-avatars}
  APP_OBJECT_STORAGE__PUBLIC_BASE_URL: ${APP_OBJECT_STORAGE__PUBLIC_BASE_URL:-http://localhost:9000}
  APP_OBJECT_STORAGE__PUBLIC_INCLUDE_BUCKET: ${APP_OBJECT_STORAGE__PUBLIC_INCLUDE_BUCKET:-}
  APP_OBJECT_STORAGE__MAX_UPLOAD_SIZE_MB: "${APP_OBJECT_STORAGE__MAX_UPLOAD_SIZE_MB:-5}"

x-admin-env: &admin-env
  APP_DB__USER: ${APP_DB__USER:-postgres}
  APP_DB__PASSWORD: ${APP_DB__PASSWORD:-postgres}
  APP_DB__HOST: ${APP_DB__HOST:-db}
  APP_DB__PORT: "${APP_DB__PORT:-5432}"
  APP_DB__NAME: ${APP_DB__NAME:-postgres}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-CHANGE_THIS_DJANGO_SECRET}
  DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,admin}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${APP_OBJECT_STORAGE__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${APP_OBJECT_STORAGE__SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: migrate
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: prod-api
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  admin-migrate:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: migrate
    environment: *admin-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: prod-admin
    environment: *admin-env
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
      admin-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_TELEGRAM_WIDGET_HOSTNAME: ${VITE_TELEGRAM_WIDGET_HOSTNAME:-localhost}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
