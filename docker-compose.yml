name: idea-code-release

x-backend-env: &backend-env
  APP_DB__USER: postgres
  APP_DB__PASSWORD: postgres
  APP_DB__HOST: db
  APP_DB__PORT: "5432"
  APP_DB__NAME: postgres
  APP_DB__ECHO: "false"
  APP_DB__ECHO_POOL: "false"
  APP_DB__POOL_SIZE: "20"
  APP_DB__MAX_OVERFLOW: "10"
  APP_SECURITY__JWT__TOKEN_SECRET: CHANGE_THIS_JWT_SECRET
  APP_SECURITY__JWT__TOKEN_EXPIRATION_MINUTES: "60"
  APP_SECURITY__CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    sysctls:
      vm.overcommit_memory: "1"
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: migrate
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: prod-api
    environment: *backend-env
    # ports:
    #   - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: http://localhost:8000
    # ports:
    #   - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
